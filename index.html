<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="productList"></div>

    <input  id="searchInput" type="text" placeholder="search products">

    <button id="stockBtn">In Stock</button>
    <button id="allProductsBtn">All Products</button>
    <button id="cheapBtn">Under $500</button>
    <button id="expensiveBtn">Unper $500</button>
    <input type="number" id="minPriceInput" placeholder="Min Price">
    <input type="number" id="maxPriceInput" placeholder="Max Price">
    <button type="button" id="applyFilterBtn">Apply Filter</button>

    <button id="sortPriceBtn1">Price: Low to High</button>
    <button id="sortPriceBtn2">Price: High to Low</button>

    <h2>Cart (<span id="cartCount">0</span>)</h2>
    <div id="cartList"></div>
    <p id="cartTotal">Total: $0</p>

    <button id="clearCartBtn">Clear Cart</button>

    








    
    <script src="script.js"></script>
</body>
</html>
